<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tengerpart Ingatlan – Adriai ingatlanközvetítés</title>
  <meta name="description" content="Horvátországi ingatlanok vásárlása és értékesítése az Adriai-tenger partján. Lakások, villák és házak Isztrián, Zadar, Split és Dalmácia térségében.">
  <meta name="robots" content="index, follow">
  <meta name="keywords" content="horvátországi ingatlan, horvát ingatlan, tengerparti ingatlan, horvát ingatlan vásárlás, ingatlan Horvátország, Adriai ingatlan, Isztria ingatlan, Dalmácia ingatlan">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="nav">
    <div class="brand" id="brand"></div>
    <nav id="navMenu">
      <ul id="navList"></ul>
    </nav>
    <div class="lang-switch" id="langSwitch"></div>
    <button type="button" class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="navMenu" aria-label="Menü">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
  </div>
</header>

<section class="hero">
  <div class="hero-photo">
    <img src="1000000626.jpg" alt="Az Adriai-tenger partvidéke naplementében">
  </div>
  <div class="wrap">
    <h1 id="heroTitle" class="visually-hidden"></h1>
    <p id="heroText"></p>
    <div class="hero-actions" id="heroActions"></div>
  </div>
  <div class="hero-wave"></div>
</section>

<section id="ingatlanok">
  <div class="wrap">
    <div class="eyebrow-line">
      <h2 id="propTitle"></h2>
      <span id="propNote"></span>
    </div>
    <div class="grid" id="propertyGrid"></div>
  </div>
</section>

<section id="pelda-ingatlanok">
  <div class="wrap">
    <div class="eyebrow-line">
      <h2 id="exTitle"></h2>
      <span id="exNote"></span>
    </div>
    <div class="grid" id="exampleGrid"></div>
  </div>
</section>

<section id="kiado-ingatlanok">
  <div class="wrap">
    <div class="eyebrow-line">
      <h2 id="rentTitle"></h2>
      <span id="rentNote"></span>
    </div>
    <div class="grid" id="rentalGrid"></div>
  </div>
</section>

<section id="rolunk" class="about">
  <div class="wrap">
    <div class="reveal">
      <h2 id="aboutTitle"></h2>
      <p id="aboutIntro"></p>
      <div class="stats" id="aboutStats"></div>
    </div>
  </div>
</section>

<section id="kapcsolat">
  <div class="wrap contact-grid">
    <div class="reveal">
      <h2 id="contactTitle"></h2>
      <p id="contactText"></p>
      <div class="contact-details" id="contactDetails"></div>
      <ul id="contactBullets"></ul>
    </div>
    <div class="reveal">
      <form id="listingForm" novalidate>
        <div class="row2">
          <div class="field">
            <label for="name" id="lblName" class="is-required"></label>
            <input id="name" name="name" type="text" autocomplete="name" required aria-describedby="errName">
            <span class="field-error" id="errName" role="alert"></span>
          </div>
          <div class="field">
            <label for="phone" id="lblPhone" class="is-required"></label>
            <input id="phone" name="phone" type="tel" autocomplete="tel" required aria-describedby="errPhone">
            <span class="field-error" id="errPhone" role="alert"></span>
          </div>
        </div>
        <div class="field">
          <label for="email" id="lblEmail" class="is-required"></label>
          <input id="email" name="email" type="email" autocomplete="email" required aria-describedby="errEmail">
          <span class="field-error" id="errEmail" role="alert"></span>
        </div>
        <div class="field">
          <label for="service" id="lblService" class="is-required"></label>
          <select id="service" name="service" required aria-describedby="errService">
          </select>
          <span class="field-error" id="errService" role="alert"></span>
        </div>
        <!-- Honeypot: botok kitöltik, emberek nem látják -->
        <div style="position:absolute;left:-9999px" aria-hidden="true">
          <input type="text" name="website" tabindex="-1" autocomplete="off">
        </div>
        <p class="form-note" id="formNote"></p>
        <button type="submit" class="btn" id="submitBtn"></button>
      </form>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">
    <div id="footerText"></div>
    <div id="footerContact"></div>
  </div>
</footer>

<div class="modal-overlay" id="galleryModal" hidden>
  <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="galleryTitle">
    <button type="button" class="modal-close" id="galleryClose" aria-label="Bezárás">&times;</button>
    <div class="modal-caption">
      <span id="galleryTitle"></span>
    </div>
    <p class="modal-text" id="galleryText" hidden></p>
    <ul class="modal-list" id="galleryList" hidden></ul>
    <div class="modal-img-wrap" id="galleryImgWrap">
      <button type="button" class="modal-nav modal-prev" id="galleryPrev" aria-label="Előző kép">&#8249;</button>
      <img id="galleryImg" src="" alt="">
      <button type="button" class="modal-nav modal-next" id="galleryNext" aria-label="Következő kép">&#8250;</button>
    </div>
    <div class="modal-counter-bar">
      <span class="modal-counter" id="galleryCounter"></span>
    </div>
  </div>
</div>

<div class="modal-overlay" id="statusModal" hidden>
  <div class="modal-dialog status-dialog" role="alertdialog" aria-modal="true" aria-labelledby="statusTitle" aria-describedby="statusText">
    <div class="status-icon" id="statusIcon" aria-hidden="true"></div>
    <h3 id="statusTitle"></h3>
    <p id="statusText"></p>
    <a id="statusLink" class="status-link" hidden></a>
    <button type="button" class="btn" id="statusClose"></button>
  </div>
</div>

<script src="content.js"></script>
<script src="script.js"></script>

</body>
</html>
