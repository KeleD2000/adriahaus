<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Adriai-tenger partvidéke</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F3140"/>
      <stop offset="45%" stop-color="#1B4B5A"/>
      <stop offset="78%" stop-color="#5E8C8F"/>
      <stop offset="100%" stop-color="#E8C27A"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDEFC9" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#F3CE86" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#F3CE86" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3E7C8C"/>
      <stop offset="12%" stop-color="#2E6B79"/>
      <stop offset="100%" stop-color="#123238"/>
    </linearGradient>
    <linearGradient id="glint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCE7B0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FCE7B0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="560" fill="url(#sky)"/>
  <circle cx="1120" cy="470" r="260" fill="url(#sun)"/>
  <circle cx="1120" cy="470" r="46" fill="#FDF2CF"/>

  <!-- távoli szigetek, enyhe párás réteggel -->
  <path d="M0 520 L140 495 L260 515 L420 488 L560 520 L560 540 L0 540 Z" fill="#315C64" opacity="0.55"/>
  <path d="M520 530 L700 500 L880 525 L1040 505 L1180 528 L1600 515 L1600 545 L520 545 Z" fill="#264B52" opacity="0.7"/>

  <!-- tenger -->
  <rect x="0" y="540" width="1600" height="360" fill="url(#sea)"/>
  <path d="M0 540 L1600 540 L1600 560 Q1120 605 0 560 Z" fill="url(#glint)" opacity="0.8"/>

  <!-- hullám csíkok -->
  <path d="M0 610 Q400 596 800 612 T1600 606" stroke="#9FD2D6" stroke-opacity="0.18" stroke-width="3" fill="none"/>
  <path d="M0 660 Q420 646 820 662 T1600 656" stroke="#CDE7E2" stroke-opacity="0.14" stroke-width="3" fill="none"/>
  <path d="M0 720 Q440 705 840 722 T1600 716" stroke="#9FD2D6" stroke-opacity="0.12" stroke-width="3" fill="none"/>
  <path d="M0 790 Q460 772 860 792 T1600 784" stroke="#CDE7E2" stroke-opacity="0.10" stroke-width="3" fill="none"/>

  <!-- vitorlás sziluett -->
  <g transform="translate(300,560)" opacity="0.8">
    <path d="M0 0 L0 -58 L34 0 Z" fill="#0E2B33"/>
    <path d="M0 0 L0 -40 L-22 0 Z" fill="#17424C"/>
    <rect x="-28" y="0" width="56" height="7" rx="2" fill="#0E2B33"/>
  </g>
</svg>
